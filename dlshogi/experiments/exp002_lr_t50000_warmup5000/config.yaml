# exp002: LR scheduling with t_initial=50000, warmup_t=5000
# Only include values that differ from base dlshogi/config.yaml

lr_scheduler:
  class_path: dlshogi.lr_scheduler.CosineLRScheduler
  init_args:
    t_initial: 50000
    lr_min: 1.0e-05
    cycle_mul: 2
    cycle_decay: 0.5
    cycle_limit: 8
    warmup_t: 5000
    warmup_lr_init: 1.0e-07
    warmup_prefix: true
    k_decay: 1.0
    last_epoch: -1
