# exp031: resume from exp029 best ckpt, flip augmentation only (KD removed)
# - Architecture: exp026 (InceptionNeXt deep512 + DropPath, 86.1M)
# - Init: resume_model from exp029 best ckpt (step=116250, val/loss=2.001)
# - Data: 50% horizontal flip augmentation (same as exp029)
# - Loss: CE only (kd_ratio=0.0, no teacher)
# - LR: cosine schedule with cycle_limit=1 (fresh cosine cycle from step 0)
trainer:
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8
  max_epochs: 16
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val/loss
      save_last: true
      save_top_k: 5
      mode: min
      save_on_train_epoch_end: false
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val/loss
      patience: 20
      min_delta: 0.0001
      mode: min
      verbose: true
model:
  network: dlshogi.experiments.exp026_droppath_bf16_fresh.model.PolicyValueNetwork
  resume_model: /home/hmatsuya/workspace/Shogi/dlcobra/dlshogi/wandb/wcsc36/wkpn9zzz/checkpoints/epoch=0-step=116250.ckpt
  compile_model: true
  flip_augmentation: true
  flip_ratio: 0.5
  kd_ratio: 0.0
data:
  batch_size: 512
  val_batch_size: 512
lr_scheduler:
  class_path: dlshogi.lr_scheduler.CosineLRScheduler
  init_args:
    t_initial: 300000
    warmup_t: 1000
    cycle_limit: 1
    warmup_prefix: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    weight_decay: 0.001
