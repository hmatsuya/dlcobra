# exp028: exp027 + Knowledge Distillation (50% CE + 50% KD from exp026 best ckpt)
# - Architecture: exp022 (InceptionNeXt + plain attention tail, same as exp027)
# - Data: exp027 training data with 50% horizontal flip augmentation
# - Loss: 50% standard CE loss, 50% KD soft target from exp026 best checkpoint (temperature=2.0)
# - LR: cosine schedule with cycle_limit=1 (single cycle, same as exp026)
model:
  network: dlshogi.experiments.exp022_plain_attention_tail.model.PolicyValueNetwork
  flip_augmentation: true
  flip_ratio: 0.5
  kd_ratio: 0.5
  teacher_network: dlshogi.experiments.exp026_droppath_bf16_fresh.model.PolicyValueNetwork
  teacher_ckpt: /home/hmatsuya/workspace/Shogi/dlcobra/dlshogi/wandb/wcsc36/bz5nhn8j/checkpoints/epoch=0-step=260000.ckpt
  teacher_temperature: 2.0
lr_scheduler:
  class_path: dlshogi.lr_scheduler.CosineLRScheduler
  init_args:
    t_initial: 300000
    warmup_t: 1000
    cycle_limit: 1
    warmup_prefix: true
