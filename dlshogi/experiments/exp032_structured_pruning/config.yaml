# exp032: Structured pruning of exp029 best ckpt + KD fine-tuning
#
# Pipeline:
#   1. Run prune.py to produce pruned_state_dict.pt  (25% MLP channel pruning)
#   2. Fine-tune with this config (KD from exp029 best ckpt as teacher)
#
# Architecture: InceptionNeXt deep512 + DropPath, mlp_expansion_dim=1536
#   Original (exp026/exp029): 86.1M params, expansion_dim=2048
#   Pruned (exp032):          65.7M params, expansion_dim=1536  (-24%)
#
# Training strategy:
#   - resume_model: pruned_state_dict.pt (weights only, LR reset)
#   - KD from exp029 best ckpt (teacher=unpruned, student=pruned)
#   - kd_ratio=0.5: helps the pruned student recover accuracy faster
#   - flip_augmentation: keep same augmentation as exp029
#   - Short cosine cycle (t_initial=100000) for fine-tuning
trainer:
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8
  max_epochs: 8
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val/loss
      save_last: true
      save_top_k: 5
      mode: min
      save_on_train_epoch_end: false
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val/loss
      patience: 20
      min_delta: 0.0001
      mode: min
      verbose: true
model:
  # PrunedPolicyValueNetwork is a thin wrapper that hardcodes mlp_expansion_dim=1536
  # so the factory can instantiate it with no arguments.
  network: dlshogi.experiments.exp032_structured_pruning.pruned_network.PrunedPolicyValueNetwork
  resume_model: /home/hmatsuya/workspace/Shogi/dlcobra/dlshogi/experiments/exp032_structured_pruning/pruned_state_dict.pt
  compile_model: true
  flip_augmentation: true
  flip_ratio: 0.5
  # KD: use exp029 best ckpt as teacher (unpruned 86.1M model)
  kd_ratio: 0.5
  teacher_network: dlshogi.experiments.exp026_droppath_bf16_fresh.model.PolicyValueNetwork
  teacher_ckpt: /home/hmatsuya/workspace/Shogi/dlcobra/dlshogi/wandb/wcsc36/wkpn9zzz/checkpoints/epoch=0-step=116250.ckpt
  teacher_temperature: 2.0
data:
  batch_size: 512
  val_batch_size: 512
lr_scheduler:
  class_path: dlshogi.lr_scheduler.CosineLRScheduler
  init_args:
    t_initial: 100000
    warmup_t: 1000
    cycle_limit: 1
    warmup_prefix: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 3.0e-4
    weight_decay: 0.001
