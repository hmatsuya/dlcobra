# exp006: Single cycle cosine annealing
# Only include values that differ from base dlshogi/config.yaml

lr_scheduler:
  class_path: dlshogi.lr_scheduler.CosineLRScheduler
  init_args:
    t_initial: 3000000
    lr_min: 1.0e-05
    cycle_limit: 1
    warmup_t: 150000
    warmup_lr_init: 1.0e-06
    warmup_prefix: true
