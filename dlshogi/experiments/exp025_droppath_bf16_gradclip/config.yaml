# exp025: exp023 + DropPath(0.2) + bf16-mixed + gradient_clip_val=1.0
# Resume from exp023 best checkpoint (val/loss=2.111, step=71250)
# Fixes: bf16 for attention stability, grad clip for collapse prevention, DropPath for structural overfitting
trainer:
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8
  max_epochs: 16
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val/loss
      save_last: true
      save_top_k: 5
      mode: min
      save_on_train_epoch_end: false
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val/loss
      patience: 20
      min_delta: 0.0001
      mode: min
      verbose: true
model:
  network: dlshogi.experiments.exp025_droppath_bf16_gradclip.model.PolicyValueNetwork
  compile_model: true
data:
  batch_size: 512
  val_batch_size: 512
lr_scheduler:
  class_path: dlshogi.lr_scheduler.CosineLRScheduler
  init_args:
    t_initial: 300000
    warmup_t: 1000
    cycle_limit: 1
    warmup_prefix: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    weight_decay: 0.001
