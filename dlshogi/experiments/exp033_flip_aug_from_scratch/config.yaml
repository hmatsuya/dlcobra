# exp033: train from scratch with flip augmentation (no KD, no resume)
# - Architecture: exp026 (InceptionNeXt deep512 + DropPath, 86.1M)
# - Init: random weights (no resume_model)
# - Data: 50% horizontal flip augmentation from step 0
# - Loss: CE only (kd_ratio=0.0)
# - LR: same cosine schedule as exp026 (t_initial=300000, single cycle)
# - Comparison: exp026 (no flip, from scratch) vs exp033 (flip, from scratch)
trainer:
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8
  max_epochs: 16
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val/loss
      save_last: true
      save_top_k: 5
      mode: min
      save_on_train_epoch_end: false
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val/loss
      patience: 20
      min_delta: 0.0001
      mode: min
      verbose: true
model:
  network: dlshogi.experiments.exp026_droppath_bf16_fresh.model.PolicyValueNetwork
  compile_model: true
  flip_augmentation: true
  flip_ratio: 0.5
  kd_ratio: 0.0
data:
  batch_size: 512
  val_batch_size: 512
lr_scheduler:
  class_path: dlshogi.lr_scheduler.CosineLRScheduler
  init_args:
    t_initial: 300000
    warmup_t: 1000
    cycle_limit: 1
    warmup_prefix: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    weight_decay: 0.001
